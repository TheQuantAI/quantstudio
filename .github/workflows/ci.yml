name: CI — QuantStudio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Frontend Checks ────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Public client config. Placeholder values are sufficient to build —
          # static prerender constructs the Supabase client but makes no network
          # calls. Real values live in Vercel for deploys (STUDIO-017 made the
          # app env-only, so the build requires these to be present).
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  # The legacy backend/ BFF and its Python CI job were removed in STUDIO-017
  # (superseded by quantcloud-api). Studio is a pure frontend app; only the
  # frontend job above runs.
